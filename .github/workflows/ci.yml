name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is built by the deploy workflow

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (includes TypeScript check)
        run: npm run build
        env:
          ADMIN_PASSWORD: ci-only
